# Foundry configuration for the Tessera contracts workspace.
# T-REX (ERC-3643 reference impl, maintained at github.com/ERC-3643/ERC-3643, tag 4.1.3)
# and ONCHAINID 2.1.0 both pin solc 0.8.17 — we match it exactly so the vendored, audited
# submodules compile unmodified. The upstream TokenySolutions/T-REX repo is deprecated and
# now redirects here; 4.1.3 is byte-identical in the core contracts to Tokeny's 4.1.6.
# Do not bump solc without re-checking the submodule pragmas (see contracts/CLAUDE.md).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.17"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Remappings are declared in remappings.txt so both forge and editor tooling read one source.
# Read anything under the workspace; write the local artifacts our scripts emit into
# packages/shared: the address book (Deploy.s.sol) and the seed manifest (Seed.s.sol).
# The write grant is scoped to the packages/shared DIRECTORY, not the individual files, on
# purpose: Foundry canonicalizes each allowed path at config load, and a file-scoped entry for
# a not-yet-created file (the fresh-clone case) fails to canonicalize and never matches — so a
# first-ever `deploy`/`seed` would be denied. The directory always exists, so scoping there
# makes both scripts clone-and-run (golden rule 4). Our scripts still only ever write those two
# JSON files.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "../packages/shared" },
]
gas_reports = ["*"]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }
invariant = { runs = 256, depth = 32 }

# ── Networks ────────────────────────────────────────────────────────────────────────────────
# Named RPC endpoints so scripts can use `--rpc-url local|amoy` instead of raw URLs, and so
# `forge verify-contract --chain amoy` resolves without a hardcoded host. Values come from env
# (never commit an endpoint with an embedded key). `local` = Anvil (31337); `amoy` = Polygon
# Amoy testnet (80002), the public showcase chain. The design mockups say "Base · 8453" as
# visual filler — ignore it; Polygon is canonical (see root CLAUDE.md).
[rpc_endpoints]
local = "${RPC_URL_LOCAL}"
amoy = "${RPC_URL_AMOY}"

# Etherscan/PolygonScan verification config, keyed by the `--chain` alias. PolygonScan's Amoy
# explorer verifies through the Etherscan-compatible v2 API; the key is read from env
# (POLYGONSCAN_API_KEY) so no secret is committed. `forge script --verify` and
# `forge verify-contract --chain amoy` both consume this block.
[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002, url = "https://api.etherscan.io/v2/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

# See https://book.getfoundry.sh/reference/config/ for more options.
