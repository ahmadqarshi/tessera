name: tessera

services:
  postgres:
    image: postgres:16-alpine
    container_name: tessera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rwa
      POSTGRES_PASSWORD: rwa
      POSTGRES_DB: rwa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwa -d rwa"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    # Foundry's Anvil node — deterministic local Polygon-compatible chain.
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: tessera-anvil
    restart: unless-stopped
    # Deterministic mnemonic so account addresses are stable across restarts, 2s blocks.
    entrypoint:
      - anvil
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --mnemonic
      - "test test test test test test test test test test test junk"
      - --block-time
      - "2"
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - CMD
        - cast
        - block-number
        - --rpc-url
        - http://localhost:8545
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
